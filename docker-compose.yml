services:
  db:
    image: postgres:17-alpine
    container_name: zarnishon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zarnishon
      # The generated password from .env.production when there is one, and the obvious
      # development default when there is not. Hardcoding it meant a production server
      # built its database with one password while the app was configured with another,
      # and the only symptom was "password authentication failed" long after the fact.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zarnishon}
      POSTGRES_DB: zarnishon
    ports:
      - "5433:5432"
    volumes:
      - zarnishon-pgdata:/var/lib/postgresql/data
volumes:
  zarnishon-pgdata:
